<p-toast></p-toast>
<p-confirmDialog key="notificationsPage"></p-confirmDialog>

<div class="page-container page-container--narrow">
  <div>
    <!-- Title & Global Actions -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Notifications</h1>
        <p class="page-subtitle">Keep track of your financial movements and alerts.</p>
      </div>
      <div class="page-actions">
        <button
          *ngIf="(notificationService.unreadCount$ | async) as count"
          pButton
          label="Mark all as read"
          icon="pi pi-check-circle"
          class="p-button-outlined p-button-sm"
          [loading]="!!(notificationService.markingAllRead$ | async)"
          (click)="markAllAsRead()">
        </button>
        <button
          pButton
          label="Clear all"
          icon="pi pi-trash"
          class="p-button-text p-button-sm p-button-danger"
          [loading]="!!(notificationService.clearing$ | async)"
          (click)="clearAll()">
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="space-y-4">
      <p-skeleton width="100%" height="80px" borderRadius="12px"></p-skeleton>
      <p-skeleton width="100%" height="80px" borderRadius="12px"></p-skeleton>
      <p-skeleton width="100%" height="80px" borderRadius="12px"></p-skeleton>
    </div>

    <!-- Empty State -->
    <div
      *ngIf="!loading && groups.length === 0"
      class="surface-card empty-state py-20">
      <div class="empty-state__icon" style="background: var(--minted-success-subtle); color: var(--minted-success);">
        <i class="pi pi-check"></i>
      </div>
      <h3 class="empty-state__title">All caught up!</h3>
      <p class="empty-state__text">
        You've seen all your notifications. Enjoy your organized financial life!
      </p>
      <button pButton label="Back to Dashboard" icon="pi pi-arrow-left" class="mt-4 p-button-outlined"
              routerLink="/">
      </button>
    </div>

    <!-- Notification Groups -->
    <div *ngIf="!loading && groups.length > 0" class="space-y-8">
      <section *ngFor="let group of groups">
        <!-- Section Header -->
        <div class="flex items-center gap-3 mb-3">
          <h3 class="text-xs font-semibold uppercase tracking-wider flex-shrink-0"
              [style.color]="'var(--minted-text-muted)'">
            {{ group.label }}
          </h3>
          <div class="h-px w-full" [style.background-color]="'var(--minted-border-light)'"></div>
        </div>

        <!-- Cards -->
        <div class="surface-card overflow-hidden">
          <div
            *ngFor="let n of group.notifications"
            class="notif-card group"
            [class.is-unread]="!n.isRead"
            (click)="onNotificationClick(n)">

            <!-- Unread accent bar -->
            <span *ngIf="!n.isRead" class="notif-card__bar"></span>

            <!-- Type icon -->
            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
                 [style.background-color]="getNotificationBg(n.type)">
              <i [class]="getNotificationIcon(n.type)" [style.color]="getNotificationColor(n.type)"></i>
            </div>

            <!-- Content -->
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start">
                <h4 class="text-[15px] truncate"
                    [style.color]="'var(--minted-text-primary)'"
                    [class.font-semibold]="!n.isRead"
                    [class.font-medium]="n.isRead">
                  {{ n.title }}
                </h4>
                <span class="text-xs font-medium tracking-tight flex-shrink-0 ml-2"
                      [style.color]="'var(--minted-text-muted)'">
                  {{ getRelativeTime(n.createdAt) }}
                </span>
              </div>
              <p class="text-sm mt-0.5" [style.color]="'var(--minted-text-secondary)'">
                {{ n.message }}
              </p>
            </div>

            <!-- Dismiss button (visible on hover) -->
            <button
              class="notif-card__dismiss"
              aria-label="Dismiss notification"
              pTooltip="Dismiss"
              tooltipPosition="left"
              (click)="dismiss($event, n.id)">
              <i class="pi pi-times text-xs"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Load More -->
      <div *ngIf="notificationService.hasMore" class="text-center pt-4">
        <button pButton label="Load more notifications"
                class="p-button-outlined p-button-sm"
                (click)="loadMore()">
        </button>
      </div>
    </div>
  </div>
</div>
