<div class="page-container">
  <!-- Header -->
  <div class="page-header">
    <div class="flex items-center gap-3">
      <button (click)="goBack()" class="back-btn" aria-label="Go back" pTooltip="Back" tooltipPosition="bottom">
        <i class="pi pi-arrow-left"></i>
      </button>
      <div>
        <h1 class="page-title">Settings</h1>
        <p class="page-subtitle">Manage accounts, categories, budgets and your preferences.</p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="settings-shell">
      <p-tabs value="0" (valueChange)="onTabChange($event)" [style]="{'overflow': 'visible'}">
        <p-tablist [style]="{'overflow': 'visible'}">
          <p-tab value="0" pTooltip="Account Types" tooltipPosition="bottom">
            <i class="pi pi-building sm:mr-2"></i>
            <span class="hidden sm:inline">Account Types</span>
          </p-tab>
          <p-tab value="1" pTooltip="Accounts" tooltipPosition="bottom">
            <i class="pi pi-wallet sm:mr-2"></i>
            <span class="hidden sm:inline">Accounts</span>
          </p-tab>
          <p-tab value="2" pTooltip="Categories" tooltipPosition="bottom">
            <i class="pi pi-tags sm:mr-2"></i>
            <span class="hidden sm:inline">Categories</span>
          </p-tab>
          <p-tab value="3" pTooltip="Budgets" tooltipPosition="bottom">
            <i class="pi pi-chart-pie sm:mr-2"></i>
            <span class="hidden sm:inline">Budgets</span>
          </p-tab>
          <p-tab value="4" pTooltip="Profile" tooltipPosition="bottom">
            <i class="pi pi-user sm:mr-2"></i>
            <span class="hidden sm:inline">Profile</span>
          </p-tab>
          <p-tab value="5" pTooltip="LLM Configuration" tooltipPosition="bottom">
            <i class="pi pi-bolt sm:mr-2"></i>
            <span class="hidden sm:inline">LLM Configuration</span>
          </p-tab>
          <p-tab value="6" pTooltip="Dashboard" tooltipPosition="bottom">
            <i class="pi pi-objects-column sm:mr-2"></i>
            <span class="hidden sm:inline">Dashboard</span>
          </p-tab>
        </p-tablist>
        <p-tabpanels [style]="{'overflow': 'visible'}">
          <p-tabpanel value="0" [style]="{'overflow': 'visible'}">
            <app-account-types></app-account-types>
          </p-tabpanel>
          <p-tabpanel value="1" [style]="{'overflow': 'visible'}">
            <app-accounts #accountsComponent></app-accounts>
          </p-tabpanel>
          <p-tabpanel value="2" [style]="{'overflow': 'visible'}">
            <app-categories></app-categories>
          </p-tabpanel>
          <p-tabpanel value="3" [style]="{'overflow': 'visible'}">
            <app-budgets></app-budgets>
          </p-tabpanel>
          <p-tabpanel value="4" [style]="{'overflow': 'visible'}">
            <app-profile></app-profile>
          </p-tabpanel>
          <p-tabpanel value="5" [style]="{'overflow': 'visible'}">
            <app-llm-config></app-llm-config>
          </p-tabpanel>
          <p-tabpanel value="6" [style]="{'overflow': 'visible'}">
            <app-dashboard-config></app-dashboard-config>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
  </div>
</div>

<!-- Toast for notifications -->
<p-toast position="top-right"></p-toast>
