<div class="page-container">
  <!-- Header -->
  <div class="page-header page-header--center">
    <div class="flex items-center gap-3">
      <button (click)="goBack()" class="back-btn" aria-label="Go back">
        <i class="pi pi-arrow-left"></i>
      </button>
      <div>
        <h1 class="page-title">Import History</h1>
        <p class="page-subtitle">View all your previous CSV imports and their status</p>
      </div>
    </div>
    <button pButton label="New Import" icon="pi pi-plus" (click)="navigateToWizard()">
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="surface-card p-4 space-y-3">
    <p-skeleton *ngFor="let i of [1,2,3,4,5]" width="100%" height="48px" borderRadius="10px"></p-skeleton>
  </div>

  <!-- AG Grid -->
  <div *ngIf="!loading" class="grid-card" style="height: 600px;">
    <ag-grid-angular
      style="width: 100%; height: 100%;"
      [theme]="mintedTheme"
      [rowData]="imports"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions">
    </ag-grid-angular>
  </div>
</div>
