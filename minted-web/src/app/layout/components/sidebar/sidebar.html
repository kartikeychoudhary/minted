<aside class="sidebar" [class.is-collapsed]="!mobileMode && !isOpen" [class.is-mobile]="mobileMode">

  <!-- Brand -->
  <div class="sidebar__brand">
    <a routerLink="/" class="sidebar__logo" (click)="onNavClick()" aria-label="Minted home">
      <span class="sidebar__logo-mark">
        <img src="assets/ico/icon.svg" alt="" class="w-6 h-6">
      </span>
      <span *ngIf="expanded" class="sidebar__logo-text">Minted</span>
    </a>
    <button *ngIf="!mobileMode" type="button" class="sidebar__collapse" (click)="toggleSidebar()"
      [attr.aria-label]="isOpen ? 'Collapse sidebar' : 'Expand sidebar'"
      [pTooltip]="isOpen ? 'Collapse sidebar' : 'Expand sidebar'" tooltipPosition="right">
      <i [class]="isOpen ? 'pi pi-angle-double-left' : 'pi pi-angle-double-right'"></i>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav" aria-label="Main navigation">
    <ng-container *ngFor="let item of navigationItems">
      <!-- Section header -->
      <p *ngIf="item.section && expanded" class="sidebar__section">{{ item.section }}</p>
      <div *ngIf="item.section && !expanded" class="sidebar__divider"></div>

      <a [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="sidebar__link" [pTooltip]="!expanded ? item.label : ''" tooltipPosition="right" (click)="onNavClick()"
        [attr.aria-label]="item.label">
        <i [class]="item.icon" class="sidebar__link-icon"></i>
        <span *ngIf="expanded" class="sidebar__link-label">{{ item.label }}</span>
        <ng-container *ngIf="item.route === '/notifications'">
          <span *ngIf="(notificationService.unreadCount$ | async) as unread" class="sidebar__badge"
            [class.is-dot]="!expanded">
            <ng-container *ngIf="expanded">{{ unread > 99 ? '99+' : unread }}</ng-container>
          </span>
        </ng-container>
      </a>
    </ng-container>
  </nav>

  <!-- User -->
  <div class="sidebar__footer">
    <!-- User menu -->
    <div *ngIf="showUserMenu" class="sidebar__menu" [class.is-floating]="!expanded" role="menu">
      <div class="sidebar__menu-head">
        <p class="sidebar__menu-name">{{ currentUser?.displayName }}</p>
        <p class="sidebar__menu-email">{{ currentUser?.email }}</p>
      </div>
      <button type="button" role="menuitem" class="sidebar__menu-item" (click)="navigateToProfile()">
        <i class="pi pi-user"></i>
        <span>Profile Settings</span>
      </button>
      <button type="button" role="menuitem" class="sidebar__menu-item is-danger" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>Logout</span>
      </button>
    </div>

    <button type="button" class="sidebar__user" (click)="toggleUserMenu()" [class.is-open]="showUserMenu"
      [pTooltip]="!expanded ? currentUser?.displayName : ''" tooltipPosition="right" aria-haspopup="menu"
      [attr.aria-expanded]="showUserMenu">
      <span class="sidebar__avatar">
        <img *ngIf="userAvatar" [src]="userAvatar" alt="" class="w-full h-full object-cover">
        <span *ngIf="!userAvatar">{{ getInitials(currentUser?.displayName || 'U') }}</span>
      </span>
      <span *ngIf="expanded" class="sidebar__user-info">
        <span class="sidebar__user-name">{{ currentUser?.displayName }}</span>
        <span class="sidebar__user-email">{{ currentUser?.email }}</span>
      </span>
      <i *ngIf="expanded" class="pi pi-chevron-up sidebar__user-chevron"></i>
    </button>
  </div>
</aside>
